name: ZumGriechen
options:
  bundleIdPrefix: com.ohrenspiel
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: de
targets:
  ZumGriechen:
    type: application
    platform: iOS
    sources:
      - path: ZumGriechen/Sources
      - path: ZumGriechen/Resources
    info:
      path: ZumGriechen/Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Zum Griechen benötigt deinen Standort, um das nächstgelegene griechische Restaurant zu finden."
        UIAppFonts:
          - Fredoka-Variable.ttf
          - Bangers-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohrenspiel.zumgriechen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
